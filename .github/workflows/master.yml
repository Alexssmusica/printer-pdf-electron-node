name: CI Master

on:
  push:
    branches:
      - master

jobs:
  CI-master:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: [22.22.2, 24.x]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Install CUPS (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev build-essential python-is-python3 gcc g++ make
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 linux-libc-dev:i386 libcups2-dev:i386 python3-dev
          sudo ldconfig

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependências
        run: npm ci

      - name: Pre Build node x64
        run: npm run prebuild:master

      - name: Pre Build node ia32
        run: npm run prebuild:master

      - name: Pre Build Electron x64
        run: npm run prebuild:master

      - name: Pre Build Electron ia32
        run: npm run prebuild:master
